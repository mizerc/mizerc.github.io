  import * as THREE from './three.module.js';
  (async function initThree() {

    const renderer = new THREE.WebGLRenderer({ canvas: c, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    
    const scene = new THREE.Scene();

    
    const camera = new THREE.PerspectiveCamera(25, 1, 1, 1000);
    camera.position.set(0, 0, 5);

    
    const geom = new THREE.BoxGeometry(1, 1, 1);
    const edges = new THREE.EdgesGeometry(geom);
    const color = isDark ? 0xffffff : 0x000000;

    
    const mat = new THREE.MeshStandardMaterial({
      color: isDark ? 0xffffff : 0x666666,
      metalness: 0.4,
      roughness: 0.5,
    });
    const cube = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
    scene.add(cube);

    
    const ambient = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambient);

    const dir1 = new THREE.DirectionalLight(0xffffff, 1.0);
    dir1.position.set(3, 3, 5);
    scene.add(dir1);

    const dir2 = new THREE.DirectionalLight(0xff0000, 0.5);
    dir2.position.set(-2, -1, -3);
    scene.add(dir2);

    const dir3 = new THREE.DirectionalLight(0x0000ff, 0.6);
    dir3.position.set(2, -1, -3);
    scene.add(dir3);

    
    function updateSize() {
      const w = c.clientWidth;
      const h = c.clientHeight;
      
      const size = 400;
      renderer.setSize(size, size, false);
      renderer.setViewport(0, 0, size, size);
      camera.aspect = 1;
      camera.lookAt(new THREE.Vector3(0, 0, 0));
      camera.updateProjectionMatrix();
    }
    updateSize();

    
    new MutationObserver(() => {
      cube.material.color.setHex(document.body.classList.contains('dark') ? 0xffffff : 0x000000);
    }).observe(document.body, { attributes: true, attributeFilter: ['class'] });

    
    let t = 0;
    function animate() {
      t += 0.05;
      cube.rotation.x = t * 0.05;
      cube.rotation.y = t * 0.05;
      renderer.setClearColor(0x000000, 0);
      renderer.clear();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  })();
